name: CI

on:
  push:
    branches: ["main", "master", "release/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests + migration + smoke benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check app tests --select E,F,W --ignore E501,E731,E741
      - name: Unit + integration + security + determinism tests
        run: python -m pytest -q
      - name: Migration on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ps05x
        run: alembic upgrade head && alembic downgrade base
      - name: Smoke benchmark (2 seeds)
        working-directory: .
        run: python tests/benchmark/run_benchmark.py --seeds 2 --out tests/benchmark/results/ci_smoke.json
      - name: Model inference test
        working-directory: .
        run: python -m pytest tests/e2e/test_model_inference.py -q
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ps05x
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10

  frontend:
    name: Frontend lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
      - run: npm run typecheck   # after build so next-env.d.ts exists

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
