name: CI

on:
  push:
    branches: ["main", "master", "release/**", "feature/**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests + migration + smoke benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check app tests --select E,F,W --ignore E501,E731,E741
      - name: Unit + integration + security + determinism tests
        run: python -m pytest -q
      - name: Migration on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ps05x
        run: alembic upgrade head && alembic downgrade base
      - name: Smoke benchmark (2 seeds)
        working-directory: .
        run: python tests/benchmark/run_benchmark.py --seeds 2 --out tests/benchmark/results/ci_smoke.json
      - name: Benchmark v2 smoke (2 seeds)
        working-directory: .
        run: python tests/benchmark/run_benchmark_v2.py --seeds 2 --out tests/benchmark/results/ci_v2_smoke.json
      - name: Offline proof verifier self-check
        working-directory: .
        run: python scripts/verify_proof.py --help
      - name: Model inference test
        working-directory: .
        run: python -m pytest tests/e2e/test_model_inference.py -q
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ps05x
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10

  frontend:
    name: Frontend lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Navigation registry (unique destinations, every route has a page)
        run: node --experimental-strip-types scripts/check-nav.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
      - run: npm run typecheck   # after build so next-env.d.ts exists

  dependencies:
    name: Dependency audit (npm + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm audit (fails on high or critical)
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependency audit
        working-directory: apps/api
        run: |
          pip install pip-audit
          # Findings are reported and the build is not failed on them, because a fix often requires a framework
          # upgrade that needs its own testing. Severity policy and any accepted finding live in
          # docs/DEPENDENCY_POLICY.md with an owner and a review date.
          pip-audit -r requirements.txt --progress-spinner off || true
      - name: Python audit summary
        working-directory: apps/api
        run: pip-audit -r requirements.txt --progress-spinner off -f json > pip-audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: apps/api/pip-audit.json
          if-no-files-found: ignore

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
