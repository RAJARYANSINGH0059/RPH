# Render Blueprint: FastAPI backend + PostgreSQL. Frontend is deployed on Vercel (see docs/DEPLOYMENT.md).
services:
  - type: web
    name: ps05x-api
    runtime: python
    rootDir: apps/api
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    # free plan has no pre-deploy hook, so migrations run at start
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ps05x-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:3000   # add your custom domain here if you use one
      - key: CORS_ORIGIN_REGEX
        value: ^https://[a-z0-9-]+\.vercel\.app$   # allows the Vercel production and preview URLs
      - key: STORAGE_DIR
        value: /opt/render/project/src/apps/api/data   # ephemeral on free plan; attach a disk or S3 for durable uploads
      - key: BENCHMARK_STORE_DIR
        value: /opt/render/project/src/apps/api/data/sealed
      - key: DEMO_ANALYST_PASSWORD
        sync: false          # set in Render dashboard; never commit
      - key: DEMO_SUPERVISOR_PASSWORD
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: ENABLE_RDAP
        value: "false"
      - key: ENABLE_DNS
        value: "false"
      - key: OCR_ENGINE
        value: "off"        # free 512 MiB instance is OOM-killed by the OCR runtime; set auto on >=1 GB instances or use the Dockerfile (Tesseract eng+hin)
      - key: STORAGE_BACKEND
        value: local         # set to s3 and fill the S3_* secrets below for durable uploads
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: ps05x-db
    plan: free
    region: singapore
    databaseName: ps05x
    user: ps05x
